services:
  - type: web
    name: api-forge
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.0.0
      - key: DATABASE_PATH
        value: ./data/apiforge.sqlite
